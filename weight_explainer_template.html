<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{page_title}}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #f0f0f0;
            padding: 40px;
            min-height: 100vh;
        }

        .chart-container {
            background: #e8e8e8;
            border-radius: 4px;
            padding: 30px 40px 20px 40px;
            max-width: 900px;
            margin: 0 auto;
        }

        .chart-title {
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #333;
        }

        .chart-area {
            position: relative;
            padding-top: 35px;
            padding-bottom: 45px;
            margin-left: 220px;
        }

        .bars-wrapper {
            position: relative;
        }

        .reference-line {
            position: absolute;
            top: 0;
            bottom: 35px;
            width: 1px;
            background: #333;
            z-index: 10;
        }

        .reference-line::before {
            content: '';
            position: absolute;
            top: 0;
            left: -3px;
            width: 7px;
            height: 1px;
            background: #333;
        }

        .reference-label {
            position: absolute;
            top: -25px;
            transform: translateX(-50%);
            font-size: 13px;
            font-weight: 400;
            font-style: italic;
            white-space: nowrap;
            color: #333;
        }

        .reference-label-bottom {
            position: absolute;
            bottom: 0;
            transform: translateX(-50%);
            font-size: 13px;
            font-weight: 400;
            font-style: italic;
            white-space: nowrap;
            color: #333;
        }

        .bar-row {
            display: flex;
            align-items: center;
            height: {{row_height}}px;
            margin-bottom: {{margin_bottom}}px;
            opacity: 0;
            animation: fadeInSlide 0.4s ease-out forwards;
        }

        @keyframes fadeInSlide {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .bar-label {
            position: absolute;
            left: -220px;
            width: 210px;
            text-align: right;
            padding-right: 15px;
            font-size: 13px;
            color: #333;
            flex-shrink: 0;
        }

        .bar-container {
            flex: 1;
            position: relative;
            height: 100%;
        }

        .bar {
            position: absolute;
            height: {{bar_height}}px;
            top: 50%;
            transform: translateY(-50%);
            border-radius: 3px;
            min-width: 2px;
        }

        .bar-value {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
        }

        .x-axis {
            position: relative;
            height: 25px;
            border-top: 1px solid #999;
            margin-top: 5px;
        }

        .tick {
            position: absolute;
            top: 8px;
            transform: translateX(-50%);
            font-size: 12px;
            color: #555;
        }

        .idx-line {
            left: {{idx_line_pct}}%;
        }

        .mcap-line {
            left: {{mcap_line_pct}}%;
        }
    </style>
</head>
<body>
    <div class="chart-container">
        {{title_html}}
        <div class="chart-area">
            <!-- Reference lines -->
            <div class="reference-line idx-line">
                <div class="reference-label">W<sub>idx</sub> = {{w_idx_formatted}}</div>
            </div>
            <div class="reference-line mcap-line">
                <div class="reference-label-bottom">W<sub>mcap</sub> = {{w_mcap_formatted}}</div>
            </div>

            <!-- Bars -->
            <div class="bars-wrapper">
                {{bars_html}}
            </div>

            <!-- X-axis -->
            <div class="x-axis">
                {{ticks_html}}
            </div>
        </div>
    </div>
</body>
</html>
